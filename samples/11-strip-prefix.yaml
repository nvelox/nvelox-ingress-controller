# Strip a URL prefix before forwarding to the backend.
#
# nvelox.io/strip-prefix: "/api"  → drops "/api" from the front of
# every request path that this Ingress routes. Common pattern:
# public-facing path is /api/v1/users, the backend Service expects
# to see /v1/users.
#
# How it works under the hood: the controller switches the route's
# match from path_prefix to path_regex "^<path>(.*)$" and emits a
# rewrite "rest-of-path$1". For paths where the strip-prefix isn't a
# prefix of the path itself, the strip is silently a no-op (route
# preserved unchanged).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector: { matchLabels: { app: echo } }
  template:
    metadata: { labels: { app: echo } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:0.2.3
          args: ["-text=stripped-hello"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: echo }
spec:
  selector: { app: echo }
  ports: [{ port: 5678, targetPort: 5678 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-stripped
  annotations:
    nvelox.io/strip-prefix: "/api"
spec:
  ingressClassName: nvelox
  rules:
    - host: stripped.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: echo
                port: { number: 5678 }

# After applying:
#   curl -H 'Host: stripped.example.com' http://<NODE_IP>:<NodePort>/api/v1/users
#     → backend sees GET /v1/users (the /api prefix is stripped)
