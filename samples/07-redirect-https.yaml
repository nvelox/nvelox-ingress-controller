# Force HTTPS — every HTTP request gets a 301 to the matching HTTPS URL.
#
# Mechanism: the `nvelox.io/redirect-https: "true"` annotation tells
# the controller to emit a redirect route on the HTTP listener for
# every host that ALSO has a TLS entry in spec.tls. The HTTPS
# listener still serves the real backend; only the HTTP side is
# rewritten.
#
# Common pattern: pair this with cert-manager (see
# samples/03-tls-cert-manager.yaml) for "always HTTPS, automatic
# certs". The Let's Encrypt HTTP-01 challenge still works because
# cert-manager solves it via its own Ingress — the challenge path
# matches first (more-specific) before any catch-all redirect.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector: { matchLabels: { app: echo } }
  template:
    metadata: { labels: { app: echo } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:0.2.3
          args: ["-text=https-only-hello"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: echo }
spec:
  selector: { app: echo }
  ports: [{ port: 5678, targetPort: 5678 }]
---
# Replace with a real cert (or cert-manager) before applying — see
# samples/02-tls-secret.yaml for the kubectl-create-secret form.
apiVersion: v1
kind: Secret
metadata:
  name: echo-tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-https-only
  annotations:
    # The annotation that makes it all happen. Off by default — the
    # absence of an annotation is the same as setting it to false.
    nvelox.io/redirect-https: "true"
spec:
  ingressClassName: nvelox
  tls:
    - hosts: [secure.example.com]
      secretName: echo-tls
  rules:
    - host: secure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 5678

# After applying:
#   curl -i http://<NODE_IP>:<NodePort>/ -H 'Host: secure.example.com'
#     → HTTP/1.1 301 Moved Permanently
#       Location: https://secure.example.com/
#
#   curl -k https://<NODE_IP>:<HTTPS NodePort>/ -H 'Host: secure.example.com'
#     → https-only-hello
