# HTTPS Ingress with auto-issued certs via cert-manager.
#
# Prereq: cert-manager installed in-cluster, plus an Issuer or
# ClusterIssuer that can solve the challenge for your host. The block
# below uses a Let's Encrypt HTTP-01 ClusterIssuer — adjust for ACME
# DNS-01, internal CA, etc.
#
# Flow:
#   1. You apply the Ingress with annotations targeting your Issuer
#   2. cert-manager sees the annotation, fires the ACME challenge,
#      and writes a kubernetes.io/tls Secret named `acme-echo-tls`
#   3. The nvelox controller's Secret watcher fires, re-renders, and
#      SIGHUPs nvelox. Certificate is live within seconds of issuance.
#   4. cert-manager keeps the Secret renewed; each renewal triggers
#      another re-render with no manual intervention.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector: { matchLabels: { app: echo } }
  template:
    metadata: { labels: { app: echo } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:0.2.3
          args: ["-text=acme-hello"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector: { app: echo }
  ports: [{ port: 5678, targetPort: 5678 }]
---
# Example ClusterIssuer — adjust email + ACME server for your env.
# In production, prefer a per-namespace Issuer so account keys aren't
# shared cluster-wide.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          # cert-manager spins up a temporary Ingress for the HTTP-01
          # challenge; class must point at this controller so the
          # challenge route gets served on :80.
          ingress:
            class: nvelox
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nvelox
  tls:
    - hosts: [acme.example.com]
      secretName: acme-echo-tls   # cert-manager writes this Secret
  rules:
    - host: acme.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 5678
