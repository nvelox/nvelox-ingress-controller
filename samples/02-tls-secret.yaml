# HTTPS Ingress with TLS termination at nvelox.
#
# Uses a standard kubernetes.io/tls Secret. The controller reads the
# Secret on every reconcile and materializes <ns>-<name>.crt / .key
# under /etc/nvelox/tls inside the nvelox container, then references
# them from the rendered listener.
#
# For real certs, replace the placeholder data with a Secret produced
# by cert-manager (see 03-tls-cert-manager.yaml) or your CA pipeline.
# This file inlines a SELF-SIGNED dev cert for quick local testing —
# generate your own with:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout tls.key \
#     -out tls.crt -subj '/CN=secure.example.com'
#   kubectl create secret tls echo-tls --cert=tls.crt --key=tls.key

apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector: { matchLabels: { app: echo } }
  template:
    metadata: { labels: { app: echo } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:0.2.3
          args: ["-text=secure-hello"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector: { app: echo }
  ports: [{ port: 5678, targetPort: 5678 }]
---
# Placeholder Secret — REPLACE WITH A REAL CERT before applying. Helm
# value-mode example:
#   kubectl create secret tls echo-tls --cert=tls.crt --key=tls.key
# After that, delete this placeholder block (or `kubectl apply` will
# overwrite the real Secret with empty data).
apiVersion: v1
kind: Secret
metadata:
  name: echo-tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
spec:
  ingressClassName: nvelox
  tls:
    - hosts: [secure.example.com]
      secretName: echo-tls
  rules:
    - host: secure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 5678
