{{/*
External-facing Service mapping real 80/443 onto the nvelox container's
in-pod ports (default 8080/8443 so neither container needs
CAP_NET_BIND_SERVICE).

Service type is operator's choice:
  - LoadBalancer: typical production (cloud LB, MetalLB)
  - NodePort:     bare-metal / kind / minikube
  - ClusterIP:    when fronted by an external ingress / Istio / etc.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvelox-ingress-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvelox-ingress-controller.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) }}
  # Local preserves the external client's source IP (no kube-proxy SNAT),
  # so nvelox sees the real client in RemoteAddr and writes it into
  # X-Forwarded-For. With Cluster (the k8s default) the client IP is
  # SNAT'd to the node IP before nvelox accepts the connection and is
  # unrecoverable. Caveat: with Local, only nodes running an nvelox pod
  # answer on the NodePort/LB target — route external traffic accordingly
  # (or run the controller as a DaemonSet).
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "nvelox-ingress-controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.httpNodePort }}
      nodePort: {{ .Values.service.httpNodePort }}
      {{- end }}
    - name: https
      port: 443
      targetPort: https
      {{- if and (eq .Values.service.type "NodePort") .Values.service.httpsNodePort }}
      nodePort: {{ .Values.service.httpsNodePort }}
      {{- end }}
